# Perfil de despliegue (Render). Se activa con SPRING_PROFILES_ACTIVE=prod
server.port=${PORT:8080}
# Render sirve por HTTPS detras de un proxy: respeta X-Forwarded-*
server.forward-headers-strategy=framework
# La consola H2 nunca debe quedar expuesta en internet
spring.h2.console.enabled=false
spring.jpa.show-sql=false
